# Builds Facet for Linux (AppImage) and Windows (zip) and attaches them to a GitHub Release.
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), or by hand from
# the Actions tab (then the builds are only kept as downloadable artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # An older Ubuntu, so the AppImage runs on distros with an older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Tests
        run: cargo test --release --locked -p facet-core
      - name: AppImage
        run: scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "Facet-$version-windows"
          New-Item -ItemType Directory -Path "dist/$dir" | Out-Null
          Copy-Item target/release/facet.exe "dist/$dir/Facet.exe"
          Copy-Item -Recurse assets "dist/$dir/assets"
          Copy-Item README.md "dist/$dir/README.md"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

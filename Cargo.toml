[package]
name = "facet"
version = "0.1.1"
edition = "2024"
description = "A 3D gem maze tower defense"

[dependencies]
facet-core = { path = "core" }
bevy = { version = "0.20", features = ["wav"] }
bevy_egui = "0.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[workspace]
members = [".", "core"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 4

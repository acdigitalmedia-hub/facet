[package]
name = "facet3d"
version = "0.1.0"
edition = "2024"

[dependencies]
facet-core = { path = "../core" }
bevy = { version = "0.20", features = ["wav"] }
bevy_egui = "0.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
